)"/><path d="M614 95C634 95 634 95 654 95" fill="none" stroke="#0d5f73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#claro-como-eu-integro-largo-pm)"/><path d="M922 95H931Q941 95 941 105V407Q941 417 931 417H29Q19 417 19 407V119Q19 109 29 109H38" fill="none" stroke="#e8445f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#claro-como-eu-integro-largo-pc)"/><text x="480" y="441" text-anchor="middle" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="14.5" fill="#c4213f">a confirmação volta no WhatsApp</text></svg>