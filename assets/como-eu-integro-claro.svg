<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 473" width="100%" role="img" aria-labelledby="claro-como-eu-integro-largo-t claro-como-eu-integro-largo-d" preserveAspectRatio="xMidYMid meet" style="display:block;max-width:100%;height:auto"><title id="claro-como-eu-integro-largo-t">Como eu ligo um agente ao que a sua empresa já usa</title><desc id="claro-como-eu-integro-largo-d">O cliente escreve no WhatsApp; o agente entende o pedido e decide o próximo passo, passando a conversa para uma pessoa da equipe quando não resolve; consulta e grava na agenda, no ERP ou no CRM; tudo fica registrado num painel; e a confirmação volta para o cliente no WhatsApp.</desc><defs><marker id="claro-como-eu-integro-largo-pm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#0d5f73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="claro-como-eu-integro-largo-pc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#e8445f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#f2f5f3"/><g aria-hidden="true"><path d="M770 483C770 399 848 369 902 375C962 381 1010 429 1010 483" fill="none" stroke="#bccdce" stroke-width="1.2" opacity="0.8"/><path d="M808.4 483C808.4 425.88 861.44 405.48 898.16 409.56C938.96 413.64 971.6 446.28 971.6 483" fill="none" stroke="#bccdce" stroke-width="1.2" opacity="0.8"/><path d="M844.4 483C844.4 451.08 874.04 439.68 894.56 441.96C917.36 444.24 935.6 462.48 935.6 483" fill="none" stroke="#bccdce" stroke-width="1.2" opacity="0.8"/><text x="884" y="469" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#486169" opacity="0.8">18</text></g><text x="46" y="39" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" font-weight="600" fill="#c4213f">1</text><text x="72" y="38" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#486169"><tspan x="72" dy="0">o cliente escreve</tspan></text><rect x="50" y="59" width="252" height="87" rx="26" fill="#bccdce"/><rect x="46" y="55" width="252" height="87" rx="26" fill="#ffffff" stroke="#bccdce" stroke-width="1.4"/><text x="65" y="82" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="650" fill="#0f2a33"><tspan x="65" dy="0">WhatsApp</tspan></text><text x="65" y="106" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#486169"><tspan x="65" dy="0">mensagem do seu cliente, a</tspan><tspan x="65" dy="19">qualquer hora</tspan></text><text x="354" y="39" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" font-weight="600" fill="#c4213f">2</text><text x="380" y="38" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#486169"><tspan x="380" dy="0">entende e decide</tspan></text><rect x="358" y="59" width="252" height="87" rx="12" fill="#bccdce"/><rect x="354" y="55" width="252" height="87" rx="12" fill="#dcebec" stroke="#0d5f73" stroke-width="2"/><text x="367" y="82" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="650" fill="#0f2a33"><tspan x="367" dy="0">Agente</tspan></text><text x="367" y="106" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#486169"><tspan x="367" dy="0">entende o pedido e escolhe o</tspan><tspan x="367" dy="19">próximo passo</tspan></text><circle cx="592" cy="70" r="4.5" fill="#e8445f"/><path d="M384 150V186" fill="none" stroke="