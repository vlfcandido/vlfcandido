<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 419" width="100%" role="img" aria-labelledby="escuro-ia-local-largo-t escuro-ia-local-largo-d" preserveAspectRatio="xMidYMid meet" style="display:block;max-width:100%;height:auto"><title id="escuro-ia-local-largo-t">Nada roda sem o seu ok</title><desc id="escuro-ia-local-largo-d">Você pede em linguagem natural. O modelo, rodando na própria máquina, propõe um comando ou a gravação de um arquivo. Um modal mostra o texto completo para aprovar, editar ou negar; negado, o modelo tenta outro caminho. Aprovado, executa na máquina, a saída volta para a conversa e tudo fica num log de auditoria.</desc><defs><marker id="escuro-ia-local-largo-pm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#6cc6d6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="escuro-ia-local-largo-pc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#ff7a90" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#0b1e25"/><g aria-hidden="true"><path d="M770 429C770 345 848 315 902 321C962 327 1010 375 1010 429" fill="none" stroke="#2c4b55" stroke-width="1.2" opacity="0.8"/><path d="M808.4 429C808.4 371.88 861.44 351.48 898.16 355.56C938.96 359.64 971.6 392.28 971.6 429" fill="none" stroke="#2c4b55" stroke-width="1.2" opacity="0.8"/><path d="M844.4 429C844.4 397.08 874.04 385.68 894.56 387.96C917.36 390.24 935.6 408.48 935.6 429" fill="none" stroke="#2c4b55" stroke-width="1.2" opacity="0.8"/></g><text x="26" y="39" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" font-weight="600" fill="#ff8fa2">1</text><text x="52" y="38" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#97b2b5"><tspan x="52" dy="0">você pede</tspan></text><rect x="30" y="59" width="185" height="68" rx="26" fill="#2c4b55"/><rect x="26" y="55" width="185" height="68" rx="26" fill="#112a33" stroke="#2c4b55" stroke-width="1.4"/><text x="45" y="82" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="650" fill="#e3eeec"><tspan x="45" dy="0">Pedido</tspan></text><text x="45" y="106" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#97b2b5"><tspan x="45" dy="0">em linguagem </tspan><tspan x="45" dy="19">natural</tspan></text><text x="267" y="39" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" font-weight="600" fill="#ff8fa2">2</text><text x="293" y="38" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#97b2b5"><tspan x="293" dy="0">propõe</tspan></text><rect x="271" y="59" width="185" height="87" rx="12" fill="#2c4b55"/><rect x="267" y="55" width="185" height="87" rx="12" fill="#112a33" stroke="#2c4b55" stroke-width="1.4"/><text x="280" y="82" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="650" fill="#e3eeec"><tspan x="280" dy="0">Modelo local</tspan></text><text x="280" y="106" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#97b2b5"><tspan x="280" dy="0">propõe um comando ou </tspan><tspan x="280" dy="19">um arquivo</tspan></text><text x="508" y="39" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" font-weight="600" fill="#ff8fa2">3</text><text x="534" y="38" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#97b2b5"><tspan x="534" dy="0">você decide</tspan></text><rect x="512" y="59" width="185" height="87" rx="12" fill="#2c4b55"/><rect x="508" y="55" width="185" height="87" rx="12" fill="#163843" stroke="#6cc6d6" stroke-width="2"/><text x="521" y="82" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="650" fill="#e3eeec"><tspan x="521" dy="0">Aprovação humana</tspan></text><text x="521" y="106" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#97b2b5"><tspan x="521" dy="0">aprovar, editar ou </tspan><tspan x="521" dy="19">negar</tspan></text><circle cx="679" cy="70" r="4.5" fill="#ff7a90"/><text x="749" y="39" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" font-weight="600" fill="#ff8fa2">4</text><text x="775" y="38" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#97b2b5"><tspan x="775" dy="0">executa</tspan></text><rect x="753" y="59" width="185" height="87" rx="12" fill="#2c4b55"/><rect x="749" y="55" width="185" height="87" rx="12" fill="#112a33" stroke="#2c4b55" stroke-width="1.4"/><text x="762" y="82" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="650" fill="#e3eeec"><tspan x="762" dy="0">Execução local</tspan></text><text x="762" y="106" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#97b2b5"><tspan x="762" dy="0">a saída volta para a </tspan><tspan x="762" dy="19">conversa</tspan></text><path d="M779 150V186" fill="none" stroke="#6cc6d6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#escuro-ia-local-largo-pm)"/><text x="791" y="177" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#97b2b5"><tspan x="791" dy="0